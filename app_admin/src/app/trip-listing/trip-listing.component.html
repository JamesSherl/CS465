
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="m-0">Trips</h2>

</div>
<div *ngIf="isLoggedIn()" >

</div>


<div class="row">
  <div  class="col-md-4 mb-4" *ngFor="let trip of trips">

  </div>
</div>
